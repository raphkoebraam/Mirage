included:
  - Sources
  - Tests

excluded:
  - Derived
  - Tuist
  - .build
  # Data-only JSON fixture; line length is dictated by the simctl schema.
  - Sources/MirageKitTesting/SimulatorFixtures.swift

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - first_where
  - last_where
  - sorted_first_last
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo
  # SwiftFormat enforces trailing commas (--commas always); don't fight it.
  - trailing_comma
  # String(decoding:as:) is intentional for process output: lossy-but-total
  # beats optional handling for bytes we don't control.
  - optional_data_string_conversion

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 2
  allowed_symbols: ["_"]

# SimctlTests holds the full argv contract (one test per subcommand) and is
# intentionally long.
type_body_length:
  warning: 400

file_length:
  warning: 500
