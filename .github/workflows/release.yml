name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance (SLSA) for the release tarball; mise's github backend
  # verifies it when present.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-26
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      # The tag is the single source of truth for the version: nothing in the
      # tree has to change to cut a release, and promoting a pre-release is
      # just a second tag on the same commit.
      - name: Verify tag is SemVer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not a SemVer version." >&2
            exit 1
          fi

      # Only a signed, GitHub-verified annotated tag can publish. A bare
      # lightweight tag (or one signed with an unregistered key) is rejected.
      - name: Verify tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')
          if [ "$TYPE" != "tag" ]; then
            echo "$GITHUB_REF_NAME is a lightweight tag; create it with git tag -s." >&2
            exit 1
          fi
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          VERIFIED=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.verification.verified')
          REASON=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.verification.reason')
          if [ "$VERIFIED" != "true" ]; then
            echo "$GITHUB_REF_NAME signature not verified by GitHub ($REASON)." >&2
            exit 1
          fi

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' -E "s/(static let current = \")[^\"]*(\")/\1$VERSION\2/" \
            Sources/MirageKit/MirageVersion.swift
          grep -q "\"$VERSION\"" Sources/MirageKit/MirageVersion.swift

      - uses: jdx/mise-action@v2
      - run: tuist install
      - run: tuist generate --no-open

      # A tag can point anywhere; don't publish a build the suite hasn't seen.
      - name: Tests
        run: |
          set -o pipefail
          xcodebuild test -workspace Mirage.xcworkspace -scheme MirageKitTests \
            -destination platform=macOS -derivedDataPath build | tail -40
          xcodebuild test -workspace Mirage.xcworkspace -scheme MirageCLITests \
            -destination platform=macOS -derivedDataPath build | tail -40

      - name: Build universal release binary
        run: |
          set -o pipefail
          xcodebuild build -workspace Mirage.xcworkspace -scheme mirage \
            -configuration Release -destination platform=macOS \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO | tail -20
          lipo -info build/Build/Products/Release/mirage

      - name: Verify binary reports the tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPORTED=$(build/Build/Products/Release/mirage --version)
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "Binary reports $REPORTED, expected $VERSION." >&2
            exit 1
          fi

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/Build/Products/Release/mirage dist/
          cp README.md dist/
          [ -f LICENSE ] && cp LICENSE dist/ || true
          tar -czf "mirage-$VERSION-macos.tar.gz" -C dist .
          shasum -a 256 "mirage-$VERSION-macos.tar.gz" | tee "mirage-$VERSION-macos.tar.gz.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "mirage-$VERSION-macos.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Prefer the hand-written CHANGELOG section. A pre-release normally has
      # no section of its own, so it takes the Unreleased section instead; only
      # when neither has content do the notes fall back to being generated.
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          section() {
            awk -v v="$1" '
              $0 ~ "^## \\[" v "\\]" { capture = 1; next }
              capture && /^## / { exit }
              capture && /^\[.*\]: http/ { next }   # link definitions render as nothing
              capture { print }
            ' CHANGELOG.md
          }
          section "$VERSION" > notes.md
          case "$VERSION" in
            *-*) grep -q '[^[:space:]]' notes.md || section "Unreleased" > notes.md ;;
          esac
          if grep -q '[^[:space:]]' notes.md; then
            echo "NOTES_ARGS=--notes-file notes.md" >> "$GITHUB_ENV"
          else
            echo "No CHANGELOG entry for $VERSION; falling back to generated notes."
            echo "NOTES_ARGS=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: mirage-${{ steps.package.outputs.version }}-macos.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A hyphen means a SemVer pre-release (0.10.0-beta.1). Mark it so
          # it never becomes "latest" for GitHub, Homebrew, or mise.
          PRERELEASE_ARGS=""
          case "$VERSION" in
            *-*) PRERELEASE_ARGS="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "mirage-$VERSION-macos.tar.gz" \
            "mirage-$VERSION-macos.tar.gz.sha256" \
            --title "$VERSION" \
            $PRERELEASE_ARGS \
            $NOTES_ARGS

  homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      # HOMEBREW_TAP_TOKEN is a PAT with `contents: write` on the tap repo;
      # github.token can only reach this repository. Without it the release
      # still succeeds and prints the values to paste by hand.
      - name: Update raphkoebraam/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          case "$VERSION" in
            *-*)
              echo "Pre-release $VERSION; leaving the tap formula on the latest stable."
              exit 0
              ;;
          esac
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/mirage-$VERSION-macos.tar.gz"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; update Formula/mirage.rb by hand."
            echo "  url    \"$URL\""
            echo "  sha256 \"$SHA256\""
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/raphkoebraam/homebrew-tap.git" tap
          cd tap
          sed -i -E \
            -e "s#^  url \".*\"#  url \"$URL\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"$SHA256\"#" \
            Formula/mirage.rb
          if git diff --quiet; then
            echo "Formula already points at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: mirage $VERSION"
          git push
